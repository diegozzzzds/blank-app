# XcodeGen spec — a fallback in case MusicApp.xcodeproj ever fails to open.
#   brew install xcodegen && xcodegen generate
# Keep the settings here in sync with MusicApp.xcodeproj.
name: MusicApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "16.0"
  defaultSourceDirectoryType: syncedFolder
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MusicApp:
    type: application
    platform: iOS
    sources:
      - path: MusicApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MusicApp
        PRODUCT_NAME: MusicApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 悦听
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  MusicAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MusicAppTests
    dependencies:
      - target: MusicApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MusicAppTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  MusicApp:
    build:
      targets:
        MusicApp: all
        MusicAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusicAppTests
    archive:
      config: Release
