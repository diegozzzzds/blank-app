<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>负载测试工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
</head>
<body>

<div class="container">
    <h1 class="mt-5">负载测试工具</h1>
    
    <form id="register-form" class="mt-3">
        <h4>注册新用户</h4>
        <div class="form-group">
            <label for="register-username">用户名:</label>
            <input type="text" class="form-control" id="register-username" required>
        </div>
        <div class="form-group">
            <label for="register-password">密码:</label>
            <input type="password" class="form-control" id="register-password" required>
        </div>
        <button type="submit" class="btn btn-primary">注册</button>
    </form>

    <form id="login-form" class="mt-3">
        <h4>登录</h4>
        <div class="form-group">
            <label for="login-username">用户名:</label>
            <input type="text" class="form-control" id="login-username" required>
        </div>
        <div class="form-group">
            <label for="login-password">密码:</label>
            <input type="password" class="form-control" id="login-password" required>
        </div>
        <button type="submit" class="btn btn-primary">登录</button>
    </form>

    <div id="logged-in-section" style="display: none;">
        <form id="load-test-form" class="mt-3">
            <h4>负载测试</h4>
            <div class="form-group">
                <label for="url">网站 URL:</label>
                <input type="text" class="form-control" id="url" placeholder="输入网址，例如 http://example.com" required>
            </div>
            <div class="form-group">
                <label for="num_requests">请求数量:</label>
                <input type="number" class="form-control" id="num_requests" value="100" required>
            </div>
            <div class="form-group">
                <label for="num_threads">并发数量:</label>
                <input type="number" class="form-control" id="num_threads" value="10" required>
            </div>
            <div class="form-group">
                <label for="attack_time">攻击时间（秒）:</label>
                <input type="number" class="form-control" id="attack_time" value="10" required>
            </div>
            <div class="form-group">
                <label for="attack_mode">攻击模式:</label>
                <select class="form-control" id="attack_mode">
                    <option value="get">HTTP GET</option>
                    <option value="post">HTTP POST</option>
                    <option value="slowloris">慢速请求</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">开始测试</button>
        </form>

        <div class="result">
            <h3>测试结果</h3>
            <div id="status"><strong>已发送请求: 0</strong></div>
            <div id="responses"><strong>网站响应: 0</strong></div>
        </div>
    </div>
</div>

<script>
    const socket = io.connect(location.protocol + '//' + document.domain + ':' + location.port);
    
    // 用户注册
    $('#register-form').on('submit', function(event) {
        event.preventDefault();
        const username = $('#register-username').val();
        const password = $('#register-password').val();

        $.ajax({
            url: '/register',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ username: username, password: password }),
            success: function(response) {
                alert(response.message);
            },
            error: function(xhr) {
                alert('错误: ' + xhr.responseJSON.message);
            }
        });
    });

    // 用户登录
    $('#login-form').on('submit', function(event) {
        event.preventDefault();
        const username = $('#login-username').val();
        const password = $('#login-password').val();

        $.ajax({
            url: '/login',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ username: username, password: password }),
            success: function(response) {
                alert(response.message);
                $('#logged-in-section').show(); // 显示负载测试区域
                $('#register-form').hide(); // 隐藏注册表单
                $('#login-form').hide(); // 隐藏登录表单
            },
            error: function(xhr) {
                alert('错误: ' + xhr.responseJSON.message);
            }
        });
    });

    // 启动负载测试
    $('#load-test-form').on('submit', function(event) {
        event.preventDefault(); // 防止表单默认提交

        const data = {
            url: $('#url').val(),
            num_requests: parseInt($('#num_requests').val()),
            num_threads: parseInt($('#num_threads').val()),
            attack_time: parseInt($('#attack_time').val()),
            attack_mode: $('#attack_mode').val()
        };

        $.ajax({
            url: '/load-test',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response) {
                $('#status').html('<strong>测试已启动...</strong>');
            },
            error: function(xhr) {
                $('#status').text('错误: ' + xhr.responseJSON.message);
            }
        });
    });

    socket.on('status_update', function(data) {
        $('#status').html('<strong>已发送请求: ' + data.successful_requests + ' (失败: ' + data.failed_requests + ')</strong>');
        $('#responses').html('<strong>网站响应: ' + data.average_time.toFixed(2) + ' 秒</strong>');
    });
</script>

</body>
</html>
